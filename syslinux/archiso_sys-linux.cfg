LABEL arch
TEXT HELP
Boot the Koppie Linux live medium on BIOS.
It allows you to install Koppie Linux or perform system maintenance.
ENDTEXT
MENU LABEL Koppie Linux live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Koppie Linux live medium on BIOS with speakup screen reader.
It allows you to install Koppie Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Koppie Linux live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%

