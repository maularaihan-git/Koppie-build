LABEL arch_nbd
TEXT HELP
Boot the Koppie Linux live medium using NBD.
It allows you to install Koppie Linux or perform system maintenance.
ENDTEXT
MENU LABEL Koppie Linux live medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

