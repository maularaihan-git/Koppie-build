# Baloo file indexer — paksa platform Qt "offscreen".
#
# Baloo ikut ke-ISO via dependensi plasma-desktop, dan baloo_file
# memanggil baloo_file_extractor per file. Extractor itu bikin
# QGuiApplication, tapi env yang diwariskan baloo_file nggak selalu
# punya DISPLAY/WAYLAND_DISPLAY yang valid, jadi Qt gagal inisialisasi
# platform plugin:
#
#   Could not load the Qt platform plugin "wayland" ...
#   Failed to create wl_display (No such file or directory)
#   This application failed to start because no Qt platform plugin
#   could be initialized.
#
# -> qFatal -> SIGABRT. Tiap file gagal, extractor dibunuh, systemd-coredump
# manggil drkonqi, ulang. Di host pengembangan terukur 3,3 crash/detik,
# 6.058 core dump (4,1 GB), ~27% CPU terbuang, 388 MB swap — dan content
# indexing 100% mati karena extractor nggak pernah sempat jalan.
#
# Kenapa penting buat ISO: baloo jalan di live session yang SAMA dengan
# Calamares, jadi crash loop-nya berebut CPU/I/O sama grub-mkconfig yang
# lagi makan waktu di tengah instalasi. Ini bug yang sama dengan host.
#
# "offscreen" butuh display nol, jadi selalu bisa inisialisasi, dan
# extractor memang cuma perlu baca/ekstrak isi file — bukan nampilin apa pun.
# Cuma ngefek ke unit ini (baloo_file + anaknya); balooctl/baloosearch yang
# dijalankan dari terminal tetap pakai env terminal masing-masing.
#
# Terverifikasi di host:
#   env -i baloo_file_extractor <file>              -> exit 134 (SIGABRT)
#   env -i QT_QPA_PLATFORM=offscreen baloo_file_... -> exit 0
#   systemd-inihibit drop-in -> crash/detik: 3,3 -> 0 (30 dtk bersih)
#
# Unit-nya dari paket baloo: /usr/lib/systemd/user/kde-baloo.service
# Drop-in di /etc/systemd/user/ berlaku untuk semua user (cocok buat live user).
[Service]
Environment=QT_QPA_PLATFORM=offscreen
