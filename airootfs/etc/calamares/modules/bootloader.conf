---
# bootloader GRUB - BIOS + UEFI (Calamares 3.4)
efiBootLoader: "grub"
# efiBootloaderId memastikan direktori EFI terisolasi di /boot/efi/EFI/koppie/
# TIDAK menimpa direktori bootloader OS lain seperti Windows (/EFI/Microsoft/) atau distro lain.
efiBootloaderId: "koppie"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
