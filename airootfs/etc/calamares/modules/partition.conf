---
# partition: EFI + GRUB configuration (Calamares 3.4)
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 100MiB
    label: "EFI"

defaultFileSystemType: "ext4"
availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs

# JANGAN pilih 'erase' secara otomatis — cegah disk terhapus tanpa sengaja pada dual-boot / multi-boot!
# Pengguna harus memilih secara sadar: alongside, replace partisi tertentu, atau manual.
initialPartitioningChoice: none
alwaysShowPartitionLabels: true
