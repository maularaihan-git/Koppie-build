---
# shellprocess: beresin target habis unpack (jalan di DALAM chroot target).
# 1-3: kernel/initramfs/GRUB (sistem bisa boot).
# 4-8: BUNUH sisa live (service live-user, autologin, /home/live, icon installer, pacman sync).
#   - Service koppie-live-user WAJIB mati: kalau hidup, first-boot bikin ulang user live.
#   - SDDM: hapus baris User=live pakai sed (tanpa redirect/>/printf = anti-gagal-diam).
#   - Icon calamares di /etc/skel dihapus di TARGET saja (live tidak kena:
#     /home/live sudah dicopy pas live-boot, sebelum install jalan).
#   - Restore pacman sync DB agar pacman di target bisa dipakai langsung tanpa sync ulang.
dontChroot: false
timeout: 1800
script:
    - command: rm -f /etc/mkinitcpio.conf.d/archiso.conf
      timeout: 30
    # Guard: kalau /boot/vmlinuz kosong/symlink-gantung (bug rsync -a di copytoram),
    # ambil kernel asli dari /lib/modules (ikut terpasang di target) biar mkinitcpio -P
    # dan grub-mkconfig nggak gagal. Tanpa $ (dianggap variabel Calamares).
    - command: /bin/sh -c 'if [ ! -r /boot/vmlinuz-linux-lts ]; then rm -f /boot/vmlinuz-linux-lts; cp -f /lib/modules/*/vmlinuz /boot/vmlinuz-linux-lts; fi'
      timeout: 60
    - command: mkinitcpio -P
      timeout: 900
    # timeout 120 -> 600: grub-mkconfig nyekan SEMUA disk lewat os-prober
    # (GRUB_DISABLE_OS_PROBER=false + os-prober ada di packages.x86_64).
    # Di mesin ber-USB/NTFS/Windows gampang lewat 120 detik, output-nya juga
    # ke-buffer jadi keliatan "no output from the command".
    - command: grub-mkconfig -o /boot/grub/grub.cfg
      timeout: 600
    # Restore pacman sync DB backup (100% OFFLINE)
    - command: /bin/sh -c 'if [ -d /usr/share/koppie/pacman-sync ]; then mkdir -p /var/lib/pacman/sync && cp -a /usr/share/koppie/pacman-sync/*.db /var/lib/pacman/sync/ 2>/dev/null || true; fi'
      timeout: 60
    - command: systemctl disable koppie-live-user.service
      timeout: 30
    - command: rm -f /etc/systemd/system/multi-user.target.wants/koppie-live-user.service
      timeout: 30
    - command: sed -i /^User=live$/d /etc/sddm.conf.d/koppie.conf
      timeout: 30
    - command: rm -rf /home/live
      timeout: 30
    - command: rm -f /etc/skel/Desktop/calamares.desktop
      timeout: 30
    - command: /bin/sh -c 'if ! grep -q "^\[koppie\]" /etc/pacman.conf; then printf "\n# Koppie Linux - Official Online Repository\n[koppie]\nSigLevel = Optional TrustAll\nServer = https://github.com/maularaihan-git/koppie-repo/releases/download/koppie-v1\nServer = https://raw.githubusercontent.com/maularaihan-git/koppie-repo/main/x86_64\n" >> /etc/pacman.conf; else sed -i -E "s|^Server = file:///.*koppie-repo/x86_64$|Server = https://github.com/maularaihan-git/koppie-repo/releases/download/koppie-v1\nServer = https://raw.githubusercontent.com/maularaihan-git/koppie-repo/main/x86_64|" /etc/pacman.conf; fi'
      timeout: 30
